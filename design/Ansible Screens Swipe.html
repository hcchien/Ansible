<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8"/>
<title>Ansible · 畫面預覽</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Noto+Serif+TC:wght@300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          oklch(0.962 0.012 78);
    --bg-soft:     oklch(0.942 0.014 80);
    --bg-deep:     oklch(0.918 0.014 82);
    --fg:          oklch(0.21 0.018 60);
    --fg-muted:    oklch(0.45 0.018 70);
    --fg-faint:    oklch(0.62 0.014 75);
    --rule:        oklch(0.84 0.012 75);
    --rule-soft:   oklch(0.90 0.012 76);
    --accent:      oklch(0.60 0.105 60);
    --accent-soft: oklch(0.92 0.04 70);
    --danger:      oklch(0.56 0.13 38);
    --spore:       oklch(0.58 0.07 110);
    --circle:      oklch(0.55 0.06 240);
    --serif:       'Noto Serif TC', 'Newsreader', 'Songti TC', serif;
    --serif-en:    'Newsreader', 'Noto Serif TC', serif;
    --sans:        'Noto Sans TC', 'IBM Plex Sans', system-ui, sans-serif;
    --mono:        'JetBrains Mono', 'IBM Plex Mono', monospace;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--sans);
    color: var(--fg);
    -webkit-font-smoothing: antialiased;
  }

  /* Phone screen content tokens */
  .ph { font-family: var(--serif); color: var(--fg); background: var(--bg); }
  .mono { font-family: var(--mono); }
  .serif-en { font-family: var(--serif-en); }
  .label-mono { font-family: var(--mono); font-size: 10px; letter-spacing: 0.18em; color: var(--fg-faint); text-transform: uppercase; }
  .label-mono-sm { font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; color: var(--fg-faint); text-transform: uppercase; }
  .hairline { background: var(--rule-soft); height: 0.5px; width: 100%; }
  .hairline-strong { background: var(--rule); height: 0.5px; width: 100%; }

  /* ── Carousel shell ── */
  #root { height: 100%; }

  .sw-shell {
    height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
    position: relative;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Stage: phone + nav arrows */
  .sw-stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: pan-y;
  }

  /* Sliding track */
  .sw-track {
    display: flex;
    align-items: center;
    height: 100%;
    will-change: transform;
    transition: transform 0.38s cubic-bezier(0.3, 0, 0.1, 1);
  }
  .sw-track.no-transition { transition: none; }

  .sw-slide {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Nav arrows */
  .sw-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
    border: none;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 0.5px solid rgba(0,0,0,0.09);
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    width: 44px;
    height: 44px;
    border-radius: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--fg);
    transition: background 0.14s, opacity 0.14s, transform 0.14s;
  }
  .sw-arrow:hover { background: rgba(255,255,255,0.95); transform: translateY(-50%) scale(1.06); }
  .sw-arrow:active { transform: translateY(-50%) scale(0.96); }
  .sw-arrow.disabled { opacity: 0.2; pointer-events: none; }
  .sw-prev { left: 20px; }
  .sw-next { right: 20px; }

  /* Bottom bar */
  .sw-bottom {
    background: var(--bg);
    border-top: 0.5px solid var(--rule-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 14px 24px 18px;
  }

  .sw-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    text-align: center;
  }

  .sw-section {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-faint);
  }

  .sw-label {
    font-family: var(--serif);
    font-size: 14px;
    color: var(--fg-muted);
    font-weight: 400;
  }

  /* Dot strip */
  .sw-dots {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 560px;
  }

  .sw-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--rule);
    border: none;
    padding: 0;
    cursor: pointer;
    transition: background 0.18s, transform 0.18s, width 0.25s;
    flex-shrink: 0;
  }
  .sw-dot.active {
    background: var(--fg);
    width: 18px;
    border-radius: 3px;
  }
  .sw-dot:hover:not(.active) { background: var(--fg-faint); transform: scale(1.3); }

  /* Section dividers in dot strip */
  .sw-dot-sep {
    width: 0.5px;
    height: 10px;
    background: var(--rule);
    flex-shrink: 0;
    margin: 0 2px;
  }

  /* Screen counter (top-right) */
  .sw-counter {
    position: absolute;
    top: 16px;
    right: 20px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--fg-faint);
    z-index: 20;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--rule-soft);
  }

  /* Section thumbnail tabs (top) */
  .sw-sections {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    gap: 6px;
    background: rgba(255,255,255,0.65);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 0.5px solid var(--rule-soft);
    border-radius: 24px;
    padding: 5px 10px;
  }

  .sw-sec-btn {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 14px;
    transition: background 0.14s, color 0.14s;
    white-space: nowrap;
  }
  .sw-sec-btn:hover { color: var(--fg); background: rgba(0,0,0,0.04); }
  .sw-sec-btn.active {
    color: var(--bg);
    background: var(--fg);
  }
</style>

<!-- React + Babel -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<!-- Screen atoms + iOS frame -->
<script type="text/babel" src="Screens/ios-frame.jsx"></script>
<script type="text/babel" src="Screens/atoms.jsx"></script>

<!-- Individual screens -->
<script type="text/babel" src="Screens/screen-notes-home.jsx"></script>
<script type="text/babel" src="Screens/screen-murmur-capture.jsx"></script>
<script type="text/babel" src="Screens/screen-note-workspace.jsx"></script>
<script type="text/babel" src="Screens/screen-note-edit.jsx"></script>
<script type="text/babel" src="Screens/screen-ai-review.jsx"></script>
<script type="text/babel" src="Screens/screen-onboarding-welcome.jsx"></script>
<script type="text/babel" src="Screens/screen-onboarding-promise.jsx"></script>
<script type="text/babel" src="Screens/screen-onboarding-first.jsx"></script>
<script type="text/babel" src="Screens/screen-forum-list.jsx"></script>
<script type="text/babel" src="Screens/screen-forum-thread.jsx"></script>
<script type="text/babel" src="Screens/screen-source-boundary.jsx"></script>
<script type="text/babel" src="Screens/screen-circle.jsx"></script>
<script type="text/babel" src="Screens/screen-wallet.jsx"></script>
<script type="text/babel" src="Screens/screen-sync-settings.jsx"></script>
<script type="text/babel" src="Screens/screen-credential-admin.jsx"></script>
<script type="text/babel" src="Screens/screen-settings-home.jsx"></script>
<script type="text/babel" src="Screens/screen-inbox.jsx"></script>
<script type="text/babel" src="Screens/screen-search.jsx"></script>
<script type="text/babel" src="Screens/screen-profile.jsx"></script>
<script type="text/babel" src="Screens/screen-murmur-detail.jsx"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ── Screen manifest ───────────────────────────────────────────
const SCREENS = [
  // Onboarding
  { id: 'onboard-welcome',  sectionId: 'onboarding', section: 'Onboarding',        label: '00·1  開場 / Welcome',        content: () => <ScreenOnboardingWelcome/> },
  { id: 'onboard-promise',  sectionId: 'onboarding', section: 'Onboarding',        label: '00·2  三條承諾 / Promise',      content: () => <ScreenOnboardingPromise/> },
  { id: 'onboard-first',    sectionId: 'onboarding', section: 'Onboarding',        label: '00·3  第一句話 / First murmur', content: () => <ScreenOnboardingFirst/> },
  // Capture
  { id: 'notes-home',       sectionId: 'capture',    section: '碎念與筆記',          label: '01  Notes Home / 草地',         content: () => <ScreenNotesHome/> },
  { id: 'murmur-capture',   sectionId: 'capture',    section: '碎念與筆記',          label: '02  Murmur Capture / 碎念',     content: () => <ScreenMurmurCapture/> },
  { id: 'note-workspace',   sectionId: 'capture',    section: '碎念與筆記',          label: '03  Note Workspace / 工作面',   content: () => <ScreenNoteWorkspace/> },
  { id: 'note-edit',        sectionId: 'capture',    section: '碎念與筆記',          label: '03b Note Edit / 編輯中',        content: () => <ScreenNoteEdit/> },
  { id: 'ai-review',        sectionId: 'capture',    section: '碎念與筆記',          label: '04  AI Review / 越界提示',      content: () => <ScreenAIReview/> },
  // Forum
  { id: 'forum-list',       sectionId: 'forum',      section: '公開討論',            label: '05  Forum List / 討論串列表',   content: () => <ScreenForumList/> },
  { id: 'forum-thread',     sectionId: 'forum',      section: '公開討論',            label: '06  Forum Thread / 串內',       content: () => <ScreenForumThread/> },
  // Trust
  { id: 'source-boundary',  sectionId: 'trust',      section: '信任邊界',            label: '07  Source Boundary / 邊界選擇', content: () => <ScreenSourceBoundary/> },
  { id: 'circle',           sectionId: 'trust',      section: '信任邊界',            label: '08  Circle / 讀書會',           content: () => <ScreenCircle/> },
  // Identity
  { id: 'wallet',           sectionId: 'identity',   section: 'Identity',           label: '09  Wallet / 錢包',             content: () => <ScreenWallet/> },
  { id: 'sync',             sectionId: 'identity',   section: 'Identity',           label: '10  Sync / 點對點同步',         content: () => <ScreenSyncSettings/> },
  { id: 'admin',            sectionId: 'identity',   section: 'Identity',           label: '11  Admin / 存取與審計',        content: () => <ScreenCredentialAdmin/> },
  // Daily
  { id: 'settings-home',    sectionId: 'daily',      section: 'Daily',              label: '12  Settings / 設定首頁',       content: () => <ScreenSettingsHome/> },
  { id: 'inbox',            sectionId: 'daily',      section: 'Daily',              label: '13  Inbox / 收信',              content: () => <ScreenInbox/> },
  { id: 'search',           sectionId: 'daily',      section: 'Daily',              label: '14  Search / 尋路',             content: () => <ScreenSearch/> },
  { id: 'profile',          sectionId: 'daily',      section: 'Daily',              label: '15  Profile / 公開身分',        content: () => <ScreenProfile/> },
  { id: 'murmur-detail',    sectionId: 'daily',      section: 'Daily',              label: '16  Murmur Detail / 長進了哪裡', content: () => <ScreenMurmurDetail/> },
];

// Unique sections in order
const SECTIONS = [];
const seen = new Set();
SCREENS.forEach(s => { if (!seen.has(s.sectionId)) { seen.add(s.sectionId); SECTIONS.push({ id: s.sectionId, label: s.section }); }});

// ── Phone dimensions ──────────────────────────────────────────
const PHONE_W = 402;
const PHONE_H = 874;

// ── Swipe Carousel ────────────────────────────────────────────
function SwipeCarousel() {
  const [idx, setIdx] = useState(0);
  const [vp, setVp] = useState({ w: window.innerWidth, h: window.innerHeight });
  const trackRef = useRef(null);
  const touchStart = useRef(null);
  const isDragging = useRef(false);
  const dragOffset = useRef(0);

  // Viewport resize
  useEffect(() => {
    const onResize = () => setVp({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);

  // Keyboard navigation
  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp')   { e.preventDefault(); setIdx(i => Math.max(0, i - 1)); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); setIdx(i => Math.min(SCREENS.length - 1, i + 1)); }
      // Jump to section start with number keys 1–6
      const n = parseInt(e.key);
      if (n >= 1 && n <= SECTIONS.length) {
        const sid = SECTIONS[n - 1].id;
        const first = SCREENS.findIndex(s => s.sectionId === sid);
        if (first >= 0) setIdx(first);
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  // Scale phone to fit stage
  // Stage height = viewport height minus bottom bar (~90px)
  const BOTTOM_BAR = 90;
  const stageH = vp.h - BOTTOM_BAR;
  const stageW = vp.w;
  const padding = 96; // room for arrows on sides
  const scale = Math.min(
    (stageW - padding) / PHONE_W,
    (stageH - 32) / PHONE_H,
    1.0  // never upscale beyond 1×
  );
  const slideW = Math.round(PHONE_W * scale);
  const slideH = Math.round(PHONE_H * scale);
  const GAP = Math.round(stageW * 0.08); // gap between slides = 8% viewport width

  // Track offset
  const trackX = useCallback((index, extra = 0) => {
    const centerOffset = (stageW - slideW) / 2;
    return centerOffset - index * (slideW + GAP) + extra;
  }, [stageW, slideW, GAP]);

  // Touch swipe
  const onTouchStart = (e) => {
    touchStart.current = { x: e.touches[0].clientX, y: e.touches[0].clientY, time: Date.now() };
    isDragging.current = false;
    dragOffset.current = 0;
    if (trackRef.current) trackRef.current.classList.add('no-transition');
  };

  const onTouchMove = (e) => {
    if (!touchStart.current) return;
    const dx = e.touches[0].clientX - touchStart.current.x;
    const dy = e.touches[0].clientY - touchStart.current.y;
    if (!isDragging.current) {
      if (Math.abs(dx) < Math.abs(dy) * 0.8) return; // vertical scroll wins
      isDragging.current = true;
    }
    e.preventDefault();
    dragOffset.current = dx;
    if (trackRef.current) {
      trackRef.current.style.transform = `translateX(${trackX(idx, dx)}px)`;
    }
  };

  const onTouchEnd = (e) => {
    if (!touchStart.current) return;
    if (trackRef.current) trackRef.current.classList.remove('no-transition');
    const dx = dragOffset.current;
    const dt = Date.now() - touchStart.current.time;
    const velocity = Math.abs(dx) / dt;
    const threshold = slideW * 0.28;
    let next = idx;
    if (dx < -threshold || (velocity > 0.55 && dx < 0)) next = Math.min(SCREENS.length - 1, idx + 1);
    if (dx >  threshold || (velocity > 0.55 && dx > 0)) next = Math.max(0, idx - 1);
    touchStart.current = null;
    isDragging.current = false;
    dragOffset.current = 0;
    setIdx(next);
    if (trackRef.current) {
      trackRef.current.style.transform = `translateX(${trackX(next)}px)`;
    }
  };

  const cur = SCREENS[idx];
  const curSectionIdx = SECTIONS.findIndex(s => s.id === cur.sectionId);

  return (
    <div className="sw-shell">
      {/* Stage */}
      <div
        className="sw-stage"
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
      >
        {/* Section tabs */}
        <div className="sw-sections">
          {SECTIONS.map((sec, si) => (
            <button
              key={sec.id}
              className={`sw-sec-btn${sec.id === cur.sectionId ? ' active' : ''}`}
              onClick={() => {
                const first = SCREENS.findIndex(s => s.sectionId === sec.id);
                if (first >= 0) setIdx(first);
              }}
            >{sec.label}</button>
          ))}
        </div>

        {/* Screen counter */}
        <div className="sw-counter">{idx + 1} / {SCREENS.length}</div>

        {/* Sliding track */}
        <div
          ref={trackRef}
          className="sw-track"
          style={{
            position: 'absolute',
            left: 0,
            top: 0,
            height: '100%',
            width: `${SCREENS.length * (slideW + GAP) + stageW}px`,
            transform: `translateX(${trackX(idx)}px)`,
            alignItems: 'center',
          }}
        >
          {SCREENS.map((screen, i) => {
            // Only render ±2 screens from current for performance
            const shouldRender = Math.abs(i - idx) <= 2;
            const distScale = i === idx ? 1 : 0.94;
            const distOpacity = i === idx ? 1 : 0.35;
            return (
              <div
                key={screen.id}
                className="sw-slide"
                style={{
                  width: slideW,
                  height: slideH,
                  marginRight: i < SCREENS.length - 1 ? GAP : 0,
                  flexShrink: 0,
                  transition: 'opacity 0.38s, transform 0.38s',
                  opacity: distOpacity,
                  transform: `scale(${distScale})`,
                  cursor: i !== idx ? 'pointer' : 'default',
                }}
                onClick={() => { if (i !== idx) setIdx(i); }}
              >
                {shouldRender ? (
                  <div style={{
                    width: PHONE_W,
                    height: PHONE_H,
                    transform: `scale(${scale})`,
                    transformOrigin: 'top left',
                    flexShrink: 0,
                  }}>
                    <IOSDevice>
                      <screen.content />
                    </IOSDevice>
                  </div>
                ) : (
                  <div style={{
                    width: slideW, height: slideH,
                    background: 'var(--bg-soft)',
                    borderRadius: 48 * scale,
                    boxShadow: '0 8px 32px rgba(0,0,0,0.08)',
                  }} />
                )}
              </div>
            );
          })}
        </div>

        {/* Nav arrows */}
        <button
          className={`sw-arrow sw-prev${idx === 0 ? ' disabled' : ''}`}
          onClick={() => setIdx(i => Math.max(0, i - 1))}
          aria-label="Previous screen"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M10 3L5 8l5 5"/>
          </svg>
        </button>
        <button
          className={`sw-arrow sw-next${idx === SCREENS.length - 1 ? ' disabled' : ''}`}
          onClick={() => setIdx(i => Math.min(SCREENS.length - 1, i + 1))}
          aria-label="Next screen"
        >
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <path d="M6 3l5 5-5 5"/>
          </svg>
        </button>
      </div>

      {/* Bottom bar */}
      <div className="sw-bottom">
        <div className="sw-meta">
          <span className="sw-section">{cur.section}</span>
          <span className="sw-label">{cur.label}</span>
        </div>

        {/* Dot strip with section dividers */}
        <div className="sw-dots">
          {SCREENS.map((screen, i) => {
            const prevSection = i > 0 && SCREENS[i - 1].sectionId !== screen.sectionId;
            return (
              <React.Fragment key={screen.id}>
                {prevSection && <div className="sw-dot-sep" />}
                <button
                  className={`sw-dot${i === idx ? ' active' : ''}`}
                  onClick={() => setIdx(i)}
                  title={screen.label}
                />
              </React.Fragment>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SwipeCarousel/>);
</script>
</body>
</html>
