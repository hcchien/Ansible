[package]
name = "elix_zkpassport"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

# This is the Android counterpart of the pinned iOS Swoirenberg backend.
# Keep the noir_rs tag in lockstep with the Swoir/Swoirenberg versions pinned
# by ios/Runner.xcodeproj's Package.resolved.
[dependencies]
base64 = "0.22"
jni = "0.21"
noir_rs = { git = "https://github.com/zkpassport/noir_rs.git", tag = "v1.0.0-beta.22-1", features = ["barretenberg"] }
once_cell = "1.21"
# The reviewed ZKPassport planner is currently published only as JavaScript.
# Run that signed, bundled runtime inside the Rust process as a temporary
# Android-only compatibility host: no WebView, DOM, storage, or network API
# exists at this boundary. Native Rust planner parity will replace it.
rquickjs = { version = "0.10", features = ["full", "bindgen"] }
serde_json = "1.0"

# Pin pre-release crates to the versions used by the reviewed Swoirenberg
# release.  This prevents Cargo from selecting a newer incompatible RC.
elliptic-curve = ">=0.14.0-rc.0, <=0.14.0-rc.32"
ecdsa = ">=0.17.0-rc.0, <=0.17.0-rc.18"
primefield = ">=0.14.0-rc.0, <=0.14.0-rc.9"
rfc6979 = ">=0.5.0-rc.0, <=0.5.0-rc.5"

[profile.release]
strip = "symbols"
lto = true
