syntax = "proto3";

package ansible.protocol.v1;

// CRDT operation envelope shared by the app, relay, and future P2P transport.
message CrdtOp {
  // UUID v4 generated by the authoring node.
  string op_id = 1;

  // did:key of the verified author.
  string author_did = 2;

  EntityType entity_type = 3;

  // UUID of the target entity.
  string entity_id = 4;

  OpType op_type = 5;

  // Yrs binary delta. Current Q1 clients may bridge through base64 JSON while
  // the Rust CRDT layer is being wired in, but the wire contract is bytes.
  bytes payload = 6;

  // Detached Ed25519 signature over op_id || payload.
  bytes signature = 7;

  // Unix timestamp in milliseconds, assigned by the authoring node.
  int64 created_at_ms = 8;
}

enum EntityType {
  ENTITY_TYPE_UNSPECIFIED = 0;
  ENTITY_TYPE_BOARD = 1;
  ENTITY_TYPE_THREAD = 2;
  ENTITY_TYPE_POST = 3;
  ENTITY_TYPE_REACTION = 4;
}

enum OpType {
  OP_TYPE_UNSPECIFIED = 0;
  OP_TYPE_INSERT = 1;
  OP_TYPE_UPDATE = 2;
  OP_TYPE_DELETE = 3;
  OP_TYPE_CRDT_MERGE = 4;
}

message OpsDeltaRequest {
  // Relay log cursor. Use 0 for the first page.
  int64 cursor = 1;

  // Server may clamp this value.
  uint32 limit = 2;
}

message OpsDeltaResponse {
  repeated LoggedCrdtOp ops = 1;
  int64 next_cursor = 2;
  bool has_more = 3;
}

message LoggedCrdtOp {
  int64 log_id = 1;
  CrdtOp op = 2;

  // Unix timestamp in milliseconds, assigned by the relay.
  int64 received_at_ms = 3;
}
