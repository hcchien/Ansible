name: ansible_store
description: Ansible entities & repositories + Drift schema
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.10.0

dependencies:
  drift: ^2.4.0
  sqlite3: ^2.9.4
  uuid: ^4.0.0
  crypto: ^3.0.0
  # Pure-Dart KDF + AEAD for the passphrase-encrypted identity-key backup
  # (design D5-b). PBKDF2-HMAC-SHA256 + AES-GCM. No native deps, so `dart test`
  # in this package keeps working.
  cryptography: ^2.7.0

dev_dependencies:
  drift_dev: ^2.4.0
  build_runner: ^2.3.0
  lints: ^6.0.0
  test: ^1.21.0
