name: ansible_did
description: DID key mgmt & DID-auth for Ansible
publish_to: none
version: 0.1.0
environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  ansible_domain:
    path: ../domain
  flutter_rust_bridge: ^2.7.0
  flutter_secure_storage: ^9.0.0  # for Secure Enclave storage
  local_auth: ^2.2.0              # biometric confirmation for Passkeys flow

dev_dependencies:
  lints: ^6.0.0
  test: ^1.21.0

flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      android:
        ffiPlugin: true
      macos:
        ffiPlugin: true
