[package]
name = "ansible_rust_core"
version = "0.1.0"
edition = "2021"
description = "Tris-Aura V1.1 — Comp A: Ed25519 DID cryptography core"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
name = "ansible_rust_core"

[dependencies]
# Use ^2.4 so cargo can pick a compatible patch that resolves transitive dep
# conflicts (e.g. the indicatif 0.17 vs 0.18 clash in the 2.4.0 codegen binary).
flutter_rust_bridge = "^2.4"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = { version = "0.8", features = ["getrandom"] }
bs58 = "0.5"
sha2 = "0.10"
zeroize = { version = "1.7", features = ["derive"] }
hex = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
once_cell = "1"
base64 = "0.22"
ciborium = "0.2"
serde_json = "1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"

# === ZKP — arkworks-rs Groth16 ===
ark-ff            = { version = "0.4", features = ["std"] }
ark-ec            = { version = "0.4", features = ["std"] }
ark-bn254         = { version = "0.4" }
ark-groth16       = { version = "0.4" }
ark-r1cs-std      = { version = "0.4" }
ark-relations     = { version = "0.4" }
ark-serialize     = { version = "0.4" }
ark-crypto-primitives = { version = "0.4", features = ["r1cs"] }
ark-snark         = { version = "0.4" }

# === CRDT — Yrs (Rust port of Yjs) ===
yrs               = "0.21"

[build-dependencies]
# flutter_rust_bridge_codegen is only needed as a build dep for the frb
# build script hooks; the CLI binary is installed separately via setup_codegen.sh.
# Using ^2.4 avoids the indicatif conflict that affects the exact 2.4.0 binary.
flutter_rust_bridge_codegen = "^2.4"
