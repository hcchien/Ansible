[package]
name = "ansible_mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
clap = { version = "4.6.1", features = ["derive", "env"] }
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3.53", features = ["formatting", "parsing", "serde", "macros"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "io-std"] }
