# Cloud Build trigger:
#   Build config: ansible_appview/phoenix/cloudbuild.yaml
#   Included files: ansible_appview/phoenix/**

substitutions:
  _REGION: asia-east1
  _REPOSITORY: ansible
  _IMAGE_NAME: ansible-appview
  _SERVICE_NAME: ansible-appview-dev
  _ELIXIR_IMAGE: hexpm/elixir:1.19.0-erlang-27.2-debian-bookworm-20260202-slim
  _VPC_CONNECTOR: ansible-conn
  _MIGRATE_JOB_NAME: __AUTO__
  _DATABASE_URL_SECRET: __AUTO__

steps:
  - id: verify-identity-contract
    name: node:22-alpine
    entrypoint: node
    args: ["scripts/verify_identity_resolution_contract.mjs"]

  - id: start-postgres
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --detach
      - --name
      - appview-postgres
      - --network
      - cloudbuild
      - --env
      - POSTGRES_USER=postgres
      - --env
      - POSTGRES_PASSWORD=postgres
      - --env
      - POSTGRES_DB=ansible_appview_test
      - postgres:16-alpine

  - id: wait-for-postgres
    name: postgres:16-alpine
    entrypoint: sh
    args:
      - -c
      - until pg_isready -h appview-postgres -U postgres; do sleep 1; done
    waitFor: ["start-postgres"]

  - id: test
    name: ${_ELIXIR_IMAGE}
    dir: ansible_appview/phoenix
    entrypoint: sh
    env:
      - MIX_ENV=test
      - POSTGRES_HOST=appview-postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=ansible_appview_test
    args:
      - -c
      - |
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git
        # OTP rejects the intermittent Hex CDN certificate chain in Cloud
        # Build. Install Hex/Rebar from their pinned upstream release paths;
        # dependency checksums remain enforced by mix.lock.
        mix archive.install github hexpm/hex branch latest --force
        curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 \
          https://github.com/erlang/rebar3/releases/latest/download/rebar3 \
          -o /usr/local/bin/rebar3
        chmod +x /usr/local/bin/rebar3
        mix local.rebar rebar3 /usr/local/bin/rebar3 --force
        HEX_UNSAFE_HTTPS=1 mix deps.get
        mix ecto.migrate
        mix test
    waitFor: ["wait-for-postgres", "verify-identity-contract"]

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest
      - ansible_appview/phoenix
    waitFor: ["test"]

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
    waitFor: ["build-image"]

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        image="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA"
        service="${_SERVICE_NAME}"
        job="${_MIGRATE_JOB_NAME}"
        database_secret="${_DATABASE_URL_SECRET}"

        if [ "$$job" = "__AUTO__" ]; then
          job="$${service}-migrate"
        fi

        if [ "$$database_secret" = "__AUTO__" ]; then
          case "$$service" in
            *-prod) database_secret="appview-prod-database-url:latest" ;;
            *-dev) database_secret="appview-database-url:latest" ;;
            *) echo "refusing to infer database secret for service $$service" >&2; exit 1 ;;
          esac
        fi

        case "$$service" in
          *-prod)
            case "$$job:$$database_secret" in
              *-prod-migrate:appview-prod-database-url:*) ;;
              *)
                echo "refusing production deploy with non-production migration target: $$job / $$database_secret" >&2
                exit 1
                ;;
            esac
            ;;
        esac

        if gcloud run jobs describe "$$job" --region="${_REGION}" --project="$PROJECT_ID" >/dev/null 2>&1; then
          gcloud run jobs update "$$job" \
            --image="$$image" \
            --region="${_REGION}" \
            --project="$PROJECT_ID" \
            --quiet
        else
          gcloud run jobs create "$$job" \
            --image="$$image" \
            --region="${_REGION}" \
            --project="$PROJECT_ID" \
            --vpc-connector="${_VPC_CONNECTOR}" \
            --vpc-egress=private-ranges-only \
            --set-secrets=DATABASE_URL=$$database_secret \
            --command=/app/bin/ansible_appview \
            --args='eval,AnsibleAppview.Release.migrate()' \
            --quiet
        fi
        gcloud run jobs execute "$$job" --region="${_REGION}" --project="$PROJECT_ID" --wait
    waitFor: ["push-image"]

  - id: deploy-dev
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ${_SERVICE_NAME}
      - --platform=managed
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
      - --region=${_REGION}
      - --quiet
    waitFor: ["migrate"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
