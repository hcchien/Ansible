name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Flutter and Dart changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      packages: ${{ steps.filter.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null || ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only "$base" "$head" > changed_files.txt

          app=false
          packages=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/flutter-ci.yml)
                app=true
                packages=true
                ;;
              ansible_node/app/*)
                app=true
                ;;
              ansible_core/ap/*|ansible_core/store/*|ansible_core/domain/*|ansible_core/did/*|ansible_core/vc/*|ansible_core/nostr/*)
                app=true
                packages=true
                ;;
              ansible_sync/handlers/*)
                packages=true
                ;;
            esac
          done < changed_files.txt

          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  dart-flutter-packages:
    name: Dart and Flutter package checks
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: ansible_core/ap
            tool: dart
          - path: ansible_core/store
            tool: dart
          - path: ansible_core/domain
            tool: dart
          - path: ansible_core/nostr
            tool: dart
          - path: ansible_sync/handlers
            tool: dart
          - path: ansible_core/did
            tool: flutter
          - path: ansible_core/vc
            tool: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.tool }} pub get

      - name: Analyze
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.tool }} analyze

      - name: Test
        working-directory: ${{ matrix.path }}
        run: ${{ matrix.tool }} test

  flutter-app:
    name: Flutter app checks
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ansible_node/app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.3"
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

  flutter-ci:
    name: Flutter CI status
    needs:
      - changes
      - dart-flutter-packages
      - flutter-app
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check dependent job results
        shell: bash
        run: |
          set -euo pipefail

          for result in "${{ needs.changes.result }}" "${{ needs.dart-flutter-packages.result }}" "${{ needs.flutter-app.result }}"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "A Flutter CI dependency finished with result: $result"
                exit 1
                ;;
            esac
          done

          echo "Flutter CI completed or skipped successfully."
