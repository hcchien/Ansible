# Cloud Build trigger:
#   Build config: ansible_distribution_frontend/cloudbuild.yaml
#   Included files: ansible_distribution_frontend/**

substitutions:
  _REGION: asia-east1
  _REPOSITORY: ansible
  _IMAGE_NAME: ansible-web

steps:
  - id: verify-identity-contract
    name: node:22-alpine
    entrypoint: node
    args: ["scripts/verify_identity_resolution_contract.mjs"]

  - id: test
    name: node:22-alpine
    dir: ansible_distribution_frontend
    entrypoint: npm
    args: ["test"]
    waitFor: ["verify-identity-contract"]

  - id: build-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - --tag
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest
      - ansible_distribution_frontend
    waitFor: ["test"]

  - id: push-image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
    waitFor: ["build-image"]

  - id: deploy-dev
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - ansible-web
      - --platform=managed
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
      - --labels=managed-by=gcp-cloud-build-deploy-cloud-run,commit-sha=$COMMIT_SHA,gcb-build-id=$BUILD_ID
      - --region=${_REGION}
      - --quiet
    waitFor: ["push-image"]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_IMAGE_NAME}:latest

options:
  logging: CLOUD_LOGGING_ONLY
