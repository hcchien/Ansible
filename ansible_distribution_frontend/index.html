<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tris-Aura Forum Login</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="login-workspace" aria-labelledby="page-title">
        <div class="login-copy">
          <p class="section-label">Forum frontend</p>
          <h1 id="page-title">App-approved web session login</h1>
          <p>Self-custody DID sessions for scoped forum requests.</p>
        </div>

        <div class="login-panel">
          <div class="field-grid">
            <label>
              Relay base URL
              <input
                id="relay-base-url"
                type="url"
                autocomplete="off"
                spellcheck="false"
              />
            </label>
            <label>
              Web origin
              <input
                id="web-origin"
                type="url"
                autocomplete="off"
                spellcheck="false"
              />
            </label>
          </div>

          <div class="action-row">
            <button id="start-login" type="button">Start app login</button>
            <button id="poll-now" type="button" class="secondary" disabled>
              Poll now
            </button>
            <button id="sign-out" type="button" class="secondary" disabled>
              Sign out
            </button>
          </div>

          <div class="status-strip" aria-live="polite">
            <span>Status</span>
            <strong id="status-label">Signed out</strong>
          </div>

          <p id="error-box" class="error-box" hidden></p>

          <section id="challenge-panel" class="challenge-panel" hidden>
            <dl>
              <div>
                <dt>Challenge</dt>
                <dd id="challenge-id"></dd>
              </div>
              <div>
                <dt>Expires</dt>
                <dd id="challenge-expiry"></dd>
              </div>
            </dl>

            <label class="payload-field">
              App deep link
              <a id="deep-link" href="#"></a>
            </label>

            <label class="payload-field">
              QR payload
              <textarea id="qr-payload" rows="4" readonly></textarea>
            </label>
          </section>

          <section class="session-panel">
            <h2>Browser session</h2>
            <p id="token-preview">No browser session token</p>
            <button id="smoke-thread" type="button" class="secondary" disabled>
              Send forum write smoke request
            </button>
            <pre id="smoke-result" aria-live="polite"></pre>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="./src/main.mjs"></script>
  </body>
</html>
